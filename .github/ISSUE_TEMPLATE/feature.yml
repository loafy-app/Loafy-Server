name: Feature Template
description: 기능 추가 템플릿
title: "✨ [Feat] "
labels: ["✨feature"]

body:
  - type: dropdown
    id: feature-type
    attributes:
      label: "✅ 기능 종류"
      description: "추가할 기능의 종류"
      options:
        - "기타"
        - "회원/인증"
        - "지도/위치"
        - "카페 정보"
        - "검색/필터"
        - "리뷰"
        - "카페 특징/태그"
        - "북마크/찜"
        - "외부 API 연동"
    validations:
      required: true
  - type: input
    id: feature-summary
    attributes:
      label: "📝 추가할 기능에 대한 설명"
      description: "추가할 기능에 대한 짧은 설명을 적어주세요."
      placeholder: "ex) 회원가입 기능 구현"
    validations:
      required: true
  - type: textarea
    id: feature-detail
    attributes:
      label: "👀 자세한 내용 (Optional)"
      description: "작업할 기능에 대한 자세한 설명을 적어주세요."
      placeholder: |
        ex)
        - 현재 위치 기반 주변 카페 조회
        - 카페 목록을 거리순으로 정렬
        - 응답에 카페명, 주소, 좌표, 대표 태그 포함
    validations:
      required: false